2,"Rouen \u2014 the answer on the grace of God"],[1.0956000089645386,49.4463005065918,"Rouen \u2014 the prison sessions and the promise of Paradise"],[1.0952999591827393,49.44609832763672,"Rouen \u2014 the torture chamber of the great tower"],[1.0972000360488892,49.44340133666992,"The cemetery of Saint-Ouen \u2014 the abjuration"],[1.0957000255584717,49.44620132446289,"Rouen \u2014 the relapse in the cell"],[1.0886000394821167,49.44309997558594,"The Vieux-March\u00e9 \u2014 the stake"]],"marker":null,"stop_info":{"Domr\u00e9my \u2014 the church of Saint-R\u00e9my":{"texts":[["campa","The little church of Saint-R\u00e9my stands hard against the garden wall of Jacques d'Arc's house, so near that a girl at her spinning can hear the bell and cross to Mass in a few steps. Here Jehanne is christened; here she kneels so often that the sexton must chide her for coming to church too much; here she loves the sound of the bells and gives the bellringer wool and cakes to ring them well. This is the ground her right ear turns to when, in a few years, the first voice will come out of the summer noon \u2014 from the right side, toward the church."],["quote","I loved and still love God, Our Lady, and all the saints in heaven... I went willingly and often to church, and confessed my sins."],["quote_source","Trial of condemnation, sessions of 22 and 24 February 1431"],["date_confidence","traditional"],["ref_0","The parish church of Saint-R\u00e9my at Domr\u00e9my, beside her father's house, where she was baptized"]],"links":[],"date":"15 Jan 1419"},"Domr\u00e9my \u2014 the Tree of Bourlemont, the Fair May":{"texts":[["campa","On Laetare Sunday, the Sunday of the Fountains, the young folk of Domr\u00e9my walk out to the great beech on the lands of the lords of Bourlemont, near the Bois Chenu \u2014 the Ladies' Tree, others call it the Fairies' Tree, for the ladies of faery danced beneath it in the old time. Jehanne goes with the other girls; they bring bread, they sing and dance, they cut the fair May from its boughs and hang garlands for the image of Our Lady of Domr\u00e9my. Her godmother says she has seen the fairies here. Jehanne, as far as she knows, never has."],["quote","Fairly near Domr\u00e9my there is a tree called the Ladies' Tree, and others call it the Fairies' Tree... It is a big tree, a beech, from which they get the fair May, in French le beau may; and it belongs, it is said, to Pierre de Bourlemont, knight. I sometimes went there with the other girls, and made garlands for Our Lady of Domr\u00e9my... I never saw the fairies at the tree, that I know of."],["quote_source","Trial of condemnation, session of 24 February 1431"],["date_confidence","traditional"],["ref_0","The site of l'Arbre des Dames (le Beau Mai) on the Bois-Chenu hillside above Domr\u00e9my"]],"links":[],"date":"8 Apr 1421"},"Domr\u00e9my \u2014 la Fontaine des Fi\u00e9vreux":{"texts":[["campa","Beside the Ladies' Tree runs the spring the village calls the Fontaine des Fi\u00e9vreux, the fountain of the fever-sick, whose water is said to heal them. On the Sunday of the Fountains the children go down from the dancing to drink there, and the sick who can still walk come to draw its water and be made whole. Jehanne drinks with the others and has seen the fevered come; whether they were cured she cannot say, only that they came and believed. Between the beech and the healing water lies the whole enchantment of her childhood, the last of it before the light."],["quote","Near the tree there is a fountain; and people sick of the fever drink of this fountain and seek its water to restore their health. I have seen them come; but whether they were cured or not, I do not know."],["quote_source","Trial of condemnation, session of 24 February 1431"],["date_confidence","traditional"],["ref_0","La Fontaine aux Groseilliers / Fontaine des Fi\u00e9vreux by the Bois-Chenu, still flowing beneath its statue of the Maid"]],"links":[],"date":"8 Apr 1421"},"Domr\u00e9my \u2014 the Bois Chenu and the prophecy":{"texts":[["campa","Above the tree and the fountain rises the hoary oak wood the country calls the Bois Chenu \u2014 nemus canutum, the wood of the grey oaks. An old prophecy runs through the marches of Lorraine, laid to Merlin and to Bede and to Marie d'Avignon: that France, ruined by a woman, shall be saved by a virgin come out of the Bois Chenu for the healing of the nations. Jehanne herds her father's beasts on this hillside and hears the saying, as all the village hears it, and does not yet know that it is spoken of her. On this slope the basilica of the visions will one day stand."],["date_confidence","traditional"],["ref_0","The Basilique du Bois-Chenu, raised on the hillside of the oak-wood prophecy above Domr\u00e9my"]],"links":[],"date":"3 Jul 1423"},"Domr\u00e9my \u2014 her father's garden":{"texts":[["campa","A summer noon in her father's garden, hard by the church of Saint-R\u00e9my. Jehanne, a girl of the village who spins and sews and yields to no woman of Rouen in needlework, hears a voice from God on her right side, toward the church, and with the voice comes a great light. It is Saint Michael, and he does not come alone: Saints Catherine and Margaret will follow, crowned in rich and precious crowns. She is very much afraid. The voice tells her to be good, to go to church, and \u2014 in time \u2014 that she must go into France. She tells no one."],["quote","I was thirteen when I had a voice from God to help me govern myself. And the first time I was very much afraid. This voice came about noon, in summer, in my father's garden... I heard it on the right side, toward the church; and rarely do I hear it without a light."],["quote_source","Trial of condemnation, session of 22 February 1431"],["date_confidence","traditional"],["ref_0","The birthplace house of Jacques d'Arc at Domr\u00e9my, preserved as a national shrine"]],"links":[],"date":"24 Aug 1424"},"Domr\u00e9my \u2014 the Ladies' Tree and the Bois Chenu":{"texts":[["campa","On Laetare Sunday, the Fountains Sunday of the village, the young people of Domr\u00e9my go out to the great beech the old folk call the Ladies' Tree, near the spring whose waters heal the sick. Jehanne goes with them, hangs garlands on the boughs for the image of Our Lady, sings, and eats with the others. The fairies frequented the tree in the old time; her godmother has seen them. But Jehanne, since she has known that she must go into France, takes little part in the games. The prophecy of Merlin says a maid shall come from the Bois Chenu."],["quote","Quite near Domr\u00e9my there is a tree called the Ladies' Tree... I sometimes made garlands there with the other girls for the image of Our Lady of Domr\u00e9my... I never saw a fairy at the tree, so far as I know."],["quote_source","Trial of condemnation, session of 24 February 1431"],["date_confidence","traditional"],["ref_0","The Basilique du Bois-Chenu, raised on the hillside of the visions"]],"links":[],"date":"23 Mar 1428"},"Vaucouleurs \u2014 first audience with Robert de Baudricourt":{"texts":[["campa","About Ascension-tide, Jehanne persuades her uncle Durand Laxart to bring her to Vaucouleurs, the last tower of the king's obedience on the Meuse. In the castle hall she stands before the captain Robert de Baudricourt in her patched red dress and tells him the kingdom belongs not to the Dauphin but to her Lord, who wills the Dauphin to be made king and to hold it in trust; she herself will lead him to his anointing. Baudricourt laughs and tells Laxart to take her home to her father and box her ears. She goes home. The voice does not release her."],["quote","Was it not said of old that France would be ruined by a woman, and afterward restored by a virgin from the marches of Lorraine?"],["quote_source","Testimony of Durand Laxart and Catherine Le Royer, rehabilitation trial (1456)"],["date_confidence","traditional"],["ref_0","The Porte de France at Vaucouleurs, gate of the departure to come"]],"links":[],"date":"22 May 1428"},"Neufch\u00e2teau \u2014 the flight before the Burgundians":{"texts":[["campa","In July the riders of Antoine de Vergy sweep up the valley of the Meuse and burn against Vaucouleurs; the village church of Domr\u00e9my is set alight. The whole village drives its beasts south to the walled town of Neufch\u00e2teau, and Jehanne with her father and mother lodges about a fortnight at the inn of a good woman called La Rousse, helping in the house and keeping the animals. Here too a young man cites her before the court at Toul, claiming a promise of marriage; she never made one, and swears it, and the case is dismissed. She returns to a scorched village."],["quote","For fear of the Burgundians I left home and went to Neufch\u00e2teau, to the house of a woman called La Rousse, where I stayed about a fortnight."],["quote_source","Trial of condemnation, session of 22 February 1431"],["date_confidence","traditional"],["ref_0","The burned church of Saint-R\u00e9my at Domr\u00e9my, rebuilt after the raid"]],"links":[],"date":"31 Jul 1428"},"Vaucouleurs \u2014 the return, at the house of the Le Royers":{"texts":[["campa","In the dead of winter Jehanne comes again to Vaucouleurs, lodging three weeks with the wheelwright Henri Le Royer and his wife Catherine, spinning by the fire and climbing daily to hear mass in the crypt chapel of Notre-Dame-des-Vo\u00fbtes. The town begins to believe. The squire Jean de Metz finds her in her poor red dress and asks what she is doing here; her answer converts him on the spot, and he pledges his hand that he will lead her to the king. The people of Vaucouleurs buy her a horse and men's clothes: tunic, hose, boots, the dress of the road."],["quote","I must be at the King's side, though I wear my legs down to the knees. For no one in the world \u2014 kings, dukes, nor the King of Scotland's daughter \u2014 can recover the kingdom of France; nor is there succour to be had but from me, although I would rather spin beside my poor mother, for this is not my station. But I must go, and I must do it, because my Lord wills it."],["quote_source","Testimony of Jean de Metz, rehabilitation trial (1456)"],["date_confidence","traditional"],["ref_0","The crypt chapel of Notre-Dame-des-Vo\u00fbtes at Vaucouleurs, where she prayed daily"]],"links":[],"date":"10 Jan 1429"},"Nancy \u2014 before Charles II, Duke of Lorraine":{"texts":[["campa","The old Duke of Lorraine, sick and curious, sends a safe-conduct for the maid whose fame has crossed his marches. Jehanne rides to Nancy under his seal, pausing to pray at the great shrine of Saint Nicholas at Saint-Nicolas-de-Port, patron of Lorraine. The duke asks about his health, hoping for a healer. She tells him plainly she knows nothing of that, counsels him to amend his life and be reconciled with his wife, and asks instead for his son-in-law Ren\u00e9 and men to take her into France, promising to pray for him. He gives her four francs and a black horse."],["quote","The duke questioned me about his health; but of that I told him I knew nothing... I told him to give me his son and men to take me into France, and that I would pray God for his health."],["quote_source","Trial of condemnation, session of 22 February 1431"],["date_confidence","inferred"],["ref_0","The basilica of Saint-Nicolas-de-Port, her pilgrimage on the Lorraine road"]],"links":[],"date":"16 Feb 1429"},"Vaucouleurs \u2014 the Porte de France, the departure":{"texts":[["campa","On the twelfth of February, the very day the French fall at Rouvray, Jehanne tells Baudricourt that the Dauphin's arms have this day suffered great loss near Orl\u00e9ans; when the courier confirms it days later, the captain resists no more. Now, toward evening, she rides out through the Porte de France with six companions \u2014 Jean de Metz, Bertrand de Poulengy, their servants, the archer Richard, the king's courier Colet de Vienne \u2014 her hair cut round, in black and grey. Baudricourt has girt a sword on her and speaks the words of the tradition: 'Go, go, and come what may.' Eleven nights of enemy country lie ahead."],["quote","I do not fear the soldiers, for my road is made open to me; and if the soldiers come, I have God, my Lord, who will know how to clear the route that leads to messire the Dauphin. It was for this that I was born."],["quote_source","Testimony of Jean de Metz and Bertrand de Poulengy, rehabilitation trial (1456)"],["date_confidence","traditional"],["ref_0","The Porte de France at Vaucouleurs, through which the escort rode out"]],"links":[],"date":"4 Mar 1429"},"Abbey of Saint-Urbain \u2014 the first night":{"texts":[["campa","The little troop rides by night and hides by day, fording rivers swollen with the February thaw, avoiding the bridges where Burgundian and English garrisons watch. The first shelter is the abbey of Saint-Urbain on the Marne, whose abbot is kinsman to Baudricourt. The men sleep armed, lying beside her, and afterward swear they felt no stir of desire toward her, only awe, as toward something holy. She grieves that they cannot hear mass on the road; her companions dare not stop in hostile towns. She tells them not to fear: she has her counsel, and God clears the way."],["date_confidence","inferred"],["ref_0","The abbey church of Saint-Urbain on the Marne, first shelter of the ride"]],"links":[],"date":"5 Mar 1429"},"Auxerre \u2014 mass heard in the great church":{"texts":[["campa","Halfway through enemy country the riders slip into Burgundian Auxerre, unknown and unremarked, and in the great cathedral of Saint-\u00c9tienne, under the glass and the high vaults, Jehanne hears mass among strangers who do not know that the deliverance of the kingdom kneels beside them. Her voices come to her frequently on this road, comforting her. Metz and Poulengy, who set out half-doubting, are by now sworn men: they will testify that she never swore, that she said to them only that they would see, at the king's side, what she was sent to do."],["quote","On the way I passed through Auxerre, and there I heard mass in the great church; and at that time I frequently had my voices."],["quote_source","Trial of condemnation, session of 22 February 1431"],["date_confidence","inferred"],["ref_0","The cathedral of Saint-\u00c9tienne at Auxerre, where she heard mass incognito"]],"links":[],"date":"10 Mar 1429"},"Gien \u2014 into the king's obedience":{"texts":[["campa","At Gien the escort crosses the Loire and breathes at last in land of the king's obedience. Here for the first time the riders speak openly, and here the word leaps ahead of them like fire in stubble: a maid has come out of the marches of Lorraine who says she is sent by God to raise the siege of Orl\u00e9ans and lead the Dauphin to his anointing at Reims. The rumor runs down the river to starving Orl\u00e9ans, where the besieged send to question it and take heart. The prophecy of the virgin from the oak wood is in every mouth."],["date_confidence","inferred"],["ref_0","The castle and bridge-town of Gien, hinge of the Loire crossings"]],"links":[],"date":"11 Mar 1429"},"Sainte-Catherine-de-Fierbois \u2014 three masses and a letter":{"texts":[["campa","At the shrine of Saint Catherine at Fierbois, where soldiers freed from the English hang up their chains in thanksgiving, Jehanne rests a day within the protection of her own saint. She hears three masses in a single day, kneeling long in the little church under the votive irons. From here she dictates a letter to the Dauphin at Chinon, a half-day's ride on: she has come a hundred and fifty leagues to his aid, she knows many things good for him, and she will recognize him among all others. Beneath this floor, though she does not yet ask for it, a sword sleeps in the earth."],["quote","From Sainte-Catherine-de-Fierbois I sent letters to my king, saying that I was coming to help him; and there I heard three masses in one day."],["quote_source","Trial of condemnation, session of 22 February 1431"],["date_confidence","traditional"],["ref_0","The votive chapel of Sainte-Catherine-de-Fierbois, hung with the chains of freed prisoners"]],"links":[],"date":"13 Mar 1429"},"Chinon \u2014 the recognition of the Dauphin":{"texts":[["campa","About noon Jehanne enters the town below the long castle of Chinon; two days the council debates whether to receive her. Then, at night, by torchlight, she is led up into the great hall where more than three hundred knights crowd the firelight, and the king has hidden himself among them, plainly dressed, another set in his place. She walks through the press, passes the decoy, and kneels before Charles de Valois, whom she has never seen. Afterward she speaks with him apart, and gives him the secret sign \u2014 the words of his own midnight prayer \u2014 and the king's face is seen to shine."],["quote","Gentle Dauphin, my name is Jehanne la Pucelle; and the King of Heaven sends you word by me that you shall be anointed and crowned in the town of Reims, and you shall be lieutenant of the King of Heaven, who is King of France."],["quote_source","Testimony of Jean Pasquerel, her confessor, rehabilitation trial (1456)"],["date_confidence","traditional"],["ref_0","The ruined great hall of the ch\u00e2teau of Chinon, the fireplace wall still standing"]],"links":[],"date":"15 Mar 1429"},"Poitiers \u2014 the examination by the doctors":{"texts":[["campa","For three weeks the doctors and masters of the University, gathered in Poitiers under the archbishop of Reims, turn the girl over like assayers with a coin: is she of God or of the enemy? She answers the learned Seguin, who asks in his Limousin speech what tongue her voices use, that theirs is better than his. Asked why God needs men-at-arms if He wills France delivered, she gives the sentence that becomes the kingdom's rule of faith and works. Matrons of the queen of Sicily verify her virginity. The doctors conclude: in her is found only goodness, humility, virginity, devotion, honesty, simplicity. Let the king use her."],["quote","In God's name, I am not come to Poitiers to make signs; but lead me to Orl\u00e9ans, and I will show you the signs for which I am sent... The men-at-arms will fight, and God will give the victory."],["quote_source","Testimony of Seguin de Seguin, rehabilitation trial (1456); the Poitiers Conclusions"],["date_confidence","inferred"],["ref_0","The Poitiers Conclusions, the doctors' verdict that the king may use her"]],"links":[],"date":"27 Mar 1429"},"Tours \u2014 the armor, the standard, and the sword of Fierbois":{"texts":[["campa","At Tours the king has white armor made to her measure, and the painter Hauves Poulnoir works her standard: white field sown with lilies, the King of Heaven holding the world between two angels, and the names JHESUS MARIA. For a sword she sends to Sainte-Catherine-de-Fierbois, writing to the priests that her voices have shown her a blade buried in the earth behind the altar, marked with five crosses. It is found exactly there, deep-rusted; the clergy rub it and the rust falls away without effort, as if the metal had been waiting. The armorer will take no payment. Her military household forms around her: squire, pages, chaplain."],["quote","While I was at Tours or at Chinon, I sent for a sword which was in the church of Sainte-Catherine-de-Fierbois, behind the altar; and it was found there at once, all rusted... and the rust fell from it without effort."],["quote_source","Trial of condemnation, session of 27 February 1431"],["date_confidence","inferred"],["ref_0","The standard of the Maid \u2014 white, sown with lilies, JHESUS MARIA \u2014 as she described it at trial"]],"links":[],"date":"14 Apr 1429"},"Blois \u2014 the army gathered, the letter to the English":{"texts":[["campa","At Blois the relief convoy masses: carts of grain, droves of cattle, and the captains of France \u2014 the marshals, La Hire, whom she makes forswear his oaths until he can swear only by his baton. She has the priests gather round the standard morning and evening to sing anthems to Our Lady, and lets no soldier march with her unconfessed; the loose women are driven from the camp. From here goes before her the letter of defiance dictated in Holy Week: Jhesus Maria \u2014 King of England, and you, Duke of Bedford, who call yourself regent of France, do right to the King of Heaven."],["quote","Surrender to the Maid, who is sent here by God, the King of Heaven, the keys of all the good towns you have taken and violated in France... I am come from God to reclaim the blood royal. Go away, for God's sake, back to your own country; and if you will not, expect the Maid, who will shortly come upon you to your very great hurt."],["quote_source","Letter to the English, dictated about 22 March 1429, entered in the trial record"],["date_confidence","traditional"],["ref_0","The Lettre aux Anglais, copied whole into the record of her trial"]],"links":[],"date":"4 May 1429"},"Orl\u00e9ans \u2014 entry by the Burgundy gate":{"texts":[["campa","At eight in the evening she rides into starving Orl\u00e9ans on a white horse, armed at all points, her standard before her, Dunois at her side. The city presses about her with torches, crowding to touch her or her horse, feeling \u2014 the chronicle says \u2014 as if God Himself had come down among them. A torch sets the fringe of her pennon alight; she wheels her horse and crushes the flame out like a captain of long practice. She has already rebuked Dunois on the riverbank for bringing her by the wrong bank \u2014 and the wind, contrary all day, turned at her word so the barges could sail."],["quote","Are you the Bastard of Orl\u00e9ans?... You thought to deceive me, and you deceive yourselves more; for I bring you better succour than ever came to any soldier or any city \u2014 the succour of the King of Heaven."],["quote_source","Testimony of Dunois, the Bastard of Orl\u00e9ans, rehabilitation trial (1456)"],["date_confidence","attested"],["ref_0","The Maison de Jacques Boucher, treasurer of Orl\u00e9ans, where she lodged during the siege"]],"links":[],"date":"8 May 1429"},"Bastille Saint-Loup \u2014 the first assault":{"texts":[["campa","She is sleeping when the fight begins without her. She starts up crying that French blood is running on the ground, arms in haste while her page fumbles, and gallops out the Burgundy gate so hard the sparks fly, meeting the wounded coming in \u2014 she never sees French blood without her hair rising. At her coming the faltering assault turns; the bastille of Saint-Loup is stormed and burned, the first fort to fall since the siege began. Afterward she weeps over the English dead who died unconfessed, and confesses herself to Pasquerel, and bids the soldiers thank God for the victory or she will leave them."],["quote","In God's name, my counsel has told me to go against the English; but I did not know whether against their bastilles or against Fastolf, who is to victual them."],["quote_source","Testimony of Jean d'Aulon, her squire, rehabilitation trial (1456)"],["date_confidence","attested"],["ref_0","The Journal du si\u00e8ge d'Orl\u00e9ans, day-book of the deliverance"]],"links":[],"date":"13 May 1429"},"Bastille des Augustins \u2014 the south bank carried":{"texts":[["campa","The day after Ascension \u2014 which she kept holy, sending the English a last letter tied to an arrow, and weeping when they shouted back that it was news from the Armagnac whore \u2014 she crosses the river by boat and islet. The captains order retreat before the sortie from the Tourelles; Jehanne and La Hire couch their lances and charge instead, and the retreat turns to storm. The bastille of the Augustins falls by evening with its palisade and its garrison. That night, though the council votes to wait for reinforcements, she tells her confessor to rise earlier tomorrow: tomorrow blood will leave her own body."],["quote","Tomorrow blood will flow from my body, above my breast."],["quote_source","Testimony of Jean Pasquerel, rehabilitation trial (1456)"],["date_confidence","attested"],["ref_0","The site of the Augustins convent by the bridgehead, south bank of the Loire"]],"links":[],"date":"15 May 1429"},"Les Tourelles \u2014 the wound and the fall of the bridge-fort":{"texts":[["campa","From dawn the French assault the bridge-fort. As she sets a ladder to the wall an arrow drives into her above the breast, as she foretold; she weeps, pulls it out with her own hands, refuses the charmers' spells, and is anointed with oil. Toward evening, when Dunois would sound retreat, she begs a little time, prays alone in a vineyard, and returns: when the tail of her standard touches the wall, all is theirs \u2014 enter! The fort falls in a rush; Glasdale, who called her whore, drowns in the Loire in his armor, and she weeps for his soul. Orl\u00e9ans rings its bells all night."],["quote","I knew well that I should be wounded, and I told my king so; but that, wound or no wound, I would not cease to work."],["quote_source","Trial of condemnation, session of 27 February 1431"],["date_confidence","attested"],["ref_0","Cl\u00e9ment de Fauquembergue's marginal pen-sketch of the Maid (10 May 1429), the only image drawn in her lifetime"]],"links":[],"date":"16 May 1429"},"Orl\u00e9ans \u2014 the siege lifted":{"texts":[["campa","Sunday morning the English come out of their remaining bastilles and draw up in order of battle before the walls. The French issue and face them. Jehanne, wounded and in a light mail shirt, forbids the attack: it is Sunday, and it is not the Lord's pleasure to fight today; let them go. She has an altar set up in the field and mass sung twice before both armies. The English stand a while, then turn and march away toward Meung, banners up, siege abandoned after seven months. Orl\u00e9ans pours out in procession and thanksgiving, and vows the eighth of May to the Maid forever."],["quote","In God's name, let them go; it is not the good pleasure of the Lord that we should fight them today. You shall have them another time."],["quote_source","Journal du si\u00e8ge d'Orl\u00e9ans; rehabilitation testimony of the citizens of Orl\u00e9ans"],["date_confidence","attested"],["ref_0","The F\u00eates johanniques of 8 May at Orl\u00e9ans, kept every year since 1430"]],"links":[],"date":"17 May 1429"},"Jargeau \u2014 the storming of the town":{"texts":[["campa","The Loire campaign opens against Suffolk in Jargeau. When the captains hesitate at the English numbers, she tells them not to fear any multitude: God guides the work, and were she not sure of it she would rather keep sheep. In the assault she plucks the young Duke of Alen\u00e7on from the spot where a stone-gun is trained, and the gentleman who takes his place there dies. On the ladder a stone bursts on her helmet; she rises crying that the English are ours. Jargeau is carried; Suffolk yields himself, they say, to the most valiant woman in the world."],["quote","Move from this place, or that engine will kill you."],["quote_source","Testimony of Jean, Duke of Alen\u00e7on, rehabilitation trial (1456)"],["date_confidence","attested"],["ref_0","The church of Saint-\u00c9tienne at Jargeau, above the stormed walls"]],"links":[],"date":"21 Jun 1429"},"Meung-sur-Loire \u2014 the bridge taken":{"texts":[["campa","Without pausing to savor Jargeau, the army swings downriver. In one sharp evening action the French seize the fortified bridge of Meung out of the hands of its English guard, set their own garrison on it, and cut the river road between Talbot's garrisons. The Maid is in the press of it as always, her standard the moving heart of the army; the men now believe that where the standard goes the matter is already decided in heaven, and follow it as they would follow fire. Meung's castle still holds for England behind them; it does not matter. The campaign has become a single week-long motion."],["date_confidence","attested"],["ref_0","The old bridge of Meung-sur-Loire, prize of the evening assault"]],"links":[],"date":"24 Jun 1429"},"Beaugency \u2014 the surrender and the Constable's welcome":{"texts":[["campa","The English garrison, cannon-battered and cut off, yields the castle of Beaugency by composition and marches out with their lives. Into the camp, uninvited and half in disgrace, rides Arthur de Richemont, Constable of France, with his Bretons; the king's favorite would send him away, and Alen\u00e7on threatens to leave. Jehanne rides to meet him. The Constable says he does not know if she is of God, but if she is he does not fear her. She judges the hour \u2014 Fastolf and Talbot are near with a fresh army \u2014 takes his alliance, and the army turns as one to meet the English in the open."],["quote","Ah, fair Constable, you are not come by my will; but since you are come, you are welcome."],["quote_source","Guillaume Gruel, Chronique d'Arthur de Richemont"],["date_confidence","attested"],["ref_0","The keep of Beaugency, C\u00e9sar's tower above the Loire"]],"links":[],"date":"26 Jun 1429"},"Patay \u2014 the English broken in the field":{"texts":[["campa","The captains ask what to do, for the English have turned at bay in open country \u2014 the thing France has dreaded since Agincourt. She answers that though they hung from the clouds we shall have them. A stag bursting from cover betrays the English position; La Hire's vanguard strikes before the archers can plant their stakes, and the army of Fastolf and Talbot is destroyed on the road by Patay \u2014 thousands fallen, Talbot taken, Fastolf in flight. Agincourt is answered in an afternoon. She grieves that evening over a dying prisoner, holding his head while he is confessed."],["quote","In God's name, though they hung from the clouds we shall have them, for God has sent us to punish them. Today the gentle King shall have the greatest victory he has ever had; my counsel has told me they are all ours."],["quote_source","Testimony of Jean, Duke of Alen\u00e7on, rehabilitation trial (1456)"],["date_confidence","attested"],["ref_0","The battle monument on the plain of Patay, where the archers' line broke"]],"links":[],"date":"27 Jun 1429"},"Gien \u2014 the army of the anointing gathers":{"texts":[["campa","To Gien comes the king, and to Gien she summons France. Against the counselors who call the road to Reims impossible \u2014 Burgundian towns, no siege train \u2014 she sets the single argument of her voices: the Dauphin must be anointed at Reims, and the towns will open. Twelve thousand men gather without pay, gentlemen coming as archers for the love of the thing. From Gien her letters fly out to the good towns; to loyal Tournai, islanded in enemy land, she writes the week's news: in eight days the English have been chased from all the Loire, and the king goes now to his sacring."],["quote","Loyal Frenchmen of the town of Tournai, the Maid sends you news: in eight days she has chased the English out of all the places they held on the river Loire... Come to the anointing of the gentle King Charles at Reims, where we shall shortly be."],["quote_source","Letter to the citizens of Tournai, 25 June 1429"],["date_confidence","attested"],["ref_0","The letter to Tournai, 25 June 1429, sealed and sent from Gien"]],"links":[],"date":"4 Jul 1429"},"Auxerre \u2014 the closed city passed by":{"texts":[["campa","The first Burgundian city on the road neither opens nor fights. Auxerre treats: provisions sold to the army at the gates, a promise of such obedience as Troyes and Ch\u00e2lons shall render, and \u2014 the whisper runs \u2014 a quiet purse for La Tr\u00e9moille. The Maid would test the walls; the council will not. She, who four months before knelt unknown in the cathedral within, now watches its towers from the camp of a royal army. The lesson of the coronation road is set here: the towns will come to the king one by one, like the tide taking back a shore, and the sword will mostly stay sheathed."],["date_confidence","traditional"],["ref_0","The cathedral of Saint-\u00c9tienne at Auxerre, seen this time from the siege camp"]],"links":[],"date":"10 Jul 1429"},"Troyes \u2014 the city of the shameful treaty opens its gates":{"texts":[["campa","Troyes, where the treaty was signed that gave France to England, shuts its gates; the army starves before it on boiled wheat and the counselors talk of turning back. The old councillor Robert le Ma\u00e7on asks the Maid's word: in two days, she says, the city is the king's, by love or by force. All night she orders the siege like a veteran, throwing fascines into the ditches, siting the guns; at first light, when she cries the assault, the city yields. Brother Richard comes out sprinkling holy water against the demon he fears she is; she tells him to approach boldly \u2014 she will not fly away."],["quote","Approach boldly \u2014 I shall not fly away."],["quote_source","Trial of condemnation, session of 3 March 1431 (her own account of Brother Richard)"],["date_confidence","attested"],["ref_0","The Treaty of Troyes (1420), the parchment her march annuls"]],"links":[],"date":"19 Jul 1429"},"Ch\u00e2lons \u2014 the men of Domr\u00e9my on the road":{"texts":[["campa","Ch\u00e2lons opens without a blow, its bishop bearing the keys, and the road to Reims lies clear. Here, in the middle of the king's triumph, four or five men of Domr\u00e9my stand waiting in the crowd \u2014 neighbors who have walked across a war to see Jacques d'Arc's daughter beside the King of France. She greets G\u00e9rardin d'\u00c9pinal, the one Burgundian sympathizer of her village, whose child she held at the font, and gives a coat she has worn to another. To G\u00e9rardin she says the one dark sentence of the coronation road, and it will keep: she fears nothing but treachery."],["quote","I fear nothing but treachery."],["quote_source","Testimony of G\u00e9rardin d'\u00c9pinal of Domr\u00e9my, rehabilitation trial (1456)"],["date_confidence","attested"],["ref_0","The cathedral of Saint-\u00c9tienne at Ch\u00e2lons, where the keys were rendered"]],"links":[],"date":"23 Jul 1429"},"Reims \u2014 the coronation of Charles VII":{"texts":[["campa","Reims opens on the eve; all night the town makes ready. On Sunday, in the cathedral of the kings, four knights on horseback escort the Sainte Ampoule into the nave, and Charles is anointed with the oil of Clovis and crowned true King of France. Throughout the rite Jehanne stands beside the altar in armor, her standard in her hand \u2014 it had borne the burden; it was right it should have the honor. At the end she kneels weeping at the king's feet, and all who see her weep also. In the crowd stands her father, lodged at the inn of the Striped Ass; the city pays his bill."],["quote","Gentle King, now is accomplished the pleasure of God, who willed that I should raise the siege of Orl\u00e9ans and bring you to this city of Reims to receive your holy anointing, showing that you are true king, and he to whom the kingdom of France must belong."],["quote_source","Testimony of Dunois, rehabilitation trial (1456)"],["date_confidence","attested"],["ref_0","Reims cathedral and the Sainte Ampoule; her banner at the sacring ('it had borne the burden; it was right that it should have the honor' \u2014 trial, 17 March 1431)"]],"links":[],"date":"26 Jul 1429"},"Cr\u00e9py-en-Valois \u2014 'here is a good people'":{"texts":[["campa","The anointed king rides down through lands that turn French at his coming \u2014 Soissons, Ch\u00e2teau-Thierry, Provins \u2014 while Bedford maneuvers and writes insolent letters. Riding between La Fert\u00e9 and Cr\u00e9py-en-Valois through crowds crying No\u00ebl, between the archbishop of Reims and the Bastard, Jehanne speaks of her own end for the first time in the canon: would that she might be buried in this good soil when she dies. Asked where she expects to die, she answers: where it pleases God; she knows neither the hour nor the place; would that God let her go home now to her brothers and sisters, who would be so glad to see her."],["quote","Here is a good people! Never have I seen a people so rejoice at the coming of so noble a king. Would that I might be so happy, when my days end, as to be buried in this soil."],["quote_source","Testimony of Dunois, rehabilitation trial (1456)"],["date_confidence","traditional"],["ref_0","The Valois road, lined with crowds crying No\u00ebl to the anointed king"]],"links":[],"date":"20 Aug 1429"},"Saint-Denis \u2014 the cry of France":{"texts":[["campa","With Alen\u00e7on and the vanguard she seizes the abbey-town of Saint-Denis, necropolis of the kings, whose very name is the war-cry of the realm. From here for a fortnight she and the duke ride daily to the gates of Paris, skirmishing from the Porte Saint-Honor\u00e9 to Montmartre, sounding the walls of the greatest city of the West. Twice Alen\u00e7on rides back to draw the reluctant king forward from his negotiations; Burgundy has beguiled the council with truces that spend the summer. She waits under the abbey towers among the tombs of the kings, sharpening the army for the assault she believes her Lord has left in her hands."],["date_confidence","traditional"],["ref_0","The basilica of Saint-Denis, tomb-church of the kings of France"]],"links":[],"date":"4 Sep 1429"},"Paris \u2014 the assault on the Porte Saint-Honor\u00e9":{"texts":[["campa","On the feast of Our Lady's Nativity the assault goes in against the Porte Saint-Honor\u00e9. Jehanne carries her standard down into the first ditch, crosses the swine-market ridge, and stands at the lip of the great water-ditch sounding the depth with her lance-shaft, crying to Paris to yield to the King of France. A crossbow bolt pierces her thigh; her standard-bearer is shot through the head. Wounded, she will not go back, urging the assault from the ditch-edge into full night, until the captains carry her away against her will. Tomorrow, she says, they would have taken it. The king orders retreat instead."],["quote","It is good and right to keep the festival of the Blessed Mary; and in my conscience I hold it good to keep the feast of Our Lady from the beginning to the end."],["quote_source","Trial of condemnation, session of 3 March 1431 (asked whether it was well done to assault Paris on the feast)"],["date_confidence","attested"],["ref_0","The gilded statue of Jeanne d'Arc on the Place des Pyramides, beside the site of the Porte Saint-Honor\u00e9"]],"links":[],"date":"17 Sep 1429"},"Saint-Denis \u2014 the armor laid before Our Lady":{"texts":[["campa","The king breaks the campaign; the bridge Alen\u00e7on built over the Seine for a second assault is cut in the night by royal order. Before she is led away south, Jehanne hangs up her white harness and a sword won before Paris as an offering before the image of Our Lady at Saint-Denis, as wounded men-at-arms do \u2014 a soldier's ex-voto in the church whose name is the cry of France. It is the gesture of a vow suspended, not surrendered. The army that lifted Orl\u00e9ans and crowned the king is dissolved on the Loire within the fortnight; and the voices do not tell her why."],["quote","Out of devotion, as is the custom of men of war when they are wounded; and because I had been wounded before Paris; and because it was the cry of France."],["quote_source","Trial of condemnation, March 1431 (asked why she offered her arms at Saint-Denis)"],["date_confidence","attested"],["ref_0","The offered white armor of the Maid, taken by the English when Saint-Denis fell"]],"links":[],"date":"22 Sep 1429"},"Gien \u2014 the army broken up":{"texts":[["campa","At Gien, where the coronation army was born in June, the king disbands it in September. Alen\u00e7on goes home to Normandy's border; when he later asks for the Maid to campaign with him again, the council refuses. The chronicler of the house of Alen\u00e7on writes the epitaph of the season: thus were broken the will of the Maid and the army of the king. She is kept henceforth near a court that fears her sword and cherishes her legend, given honors, a household, cloth-of-gold \u2014 everything but the war her voices commanded. Between her and Paris the ministers stretch their parchment truces."],["date_confidence","attested"],["ref_0","Perceval de Cagny's chronicle: 'thus were broken the will of the Maid and the army of the king'"]],"links":[],"date":"30 Sep 1429"},"Bourges \u2014 three weeks in the house of Marguerite La Touroulde":{"texts":[["campa","In Bourges, capital of the once-mocked king, she lodges three weeks with Marguerite La Touroulde, wife of the receiver-general. Her hostess finds her simple as a child in everything but war and prayer: bathes with her at the steam-baths, sees her often in confession, watches her give alms with both hands \u2014 she was sent for the consolation of the poor, she says. Women crowd the house with rosaries for her to touch; she laughs at them: touch them yourselves. When Marguerite says she surely does not fear battle, knowing she will not be killed, she answers that she is no surer of that than any soldier."],["quote","Touch them yourselves \u2014 your touch will do them as much good as mine."],["quote_source","Testimony of Marguerite La Touroulde, rehabilitation trial (1456)"],["date_confidence","inferred"],["ref_0","The house of the receiver-general at Bourges, her winter lodging"]],"links":[],"date":"10 Oct 1429"},"Saint-Pierre-le-Mo\u00fbtier \u2014 the fifty thousand":{"texts":[["campa","Sent at last against the freebooter Perrinet Gressart's towns, she assaults Saint-Pierre-le-Mo\u00fbtier. The storm is thrown back; the retreat sounds; her squire d'Aulon, himself wounded, sees her left almost alone by the moat and rides to drag her away. Why does she stay? She lifts her visor and speaks the sentence of the hidden army: she is not alone \u2014 fifty thousand of her own are in her company, and she will not leave until the town is taken. Then: to the fagots and hurdles, all of you, and bridge the moat! It is bridged, the town is stormed, and no one understands it except that it happened."],["quote","I am not alone: I have still in my company fifty thousand of my men; and I shall not leave this spot until I have taken the town."],["quote_source","Testimony of Jean d'Aulon, rehabilitation trial (1456)"],["date_confidence","attested"],["ref_0","Her letter to the citizens of Riom (9 November 1429), bearing one of her three surviving signatures, 'Jehanne'"]],"links":[],"date":"13 Nov 1429"},"La Charit\u00e9-sur-Loire \u2014 the siege that fails":{"texts":[["campa","Before the strong town of La Charit\u00e9, Gressart's own den on the Loire, the royal siege sits down in the cold with too little powder, money, or will from the court. She writes to the good towns begging powder, saltpetre and sulphur; Riom promises and does not send. After a month of frost the siege is raised and the guns are left in the mud \u2014 the first enterprise of the Maid to fail outright, and the counselors mark it. In December the king ennobles her and all her blood with the lily and the name du Lys; the honor gilds the bridle as the reins are drawn in."],["quote","Who told you that I had a command from God to enter La Charit\u00e9?"],["quote_source","Trial of condemnation, session of 3 March 1431"],["date_confidence","traditional"],["ref_0","The letters patent of December 1429 ennobling Jehanne and all her lineage under the name du Lys"]],"links":[],"date":"3 Dec 1429"},"Sully-sur-Loire \u2014 the gilded cage and the letters of spring":{"texts":[["campa","The winter closes over her in La Tr\u00e9moille's own castle of Sully, where the court keeps her like a relic while Burgundy gathers to take Compi\u00e8gne. From Sully her letters go out in March like birds ahead of a thaw: to the Hussites of Bohemia, threatening a crusade of her own if they do not return to the faith; twice to the anxious citizens of Reims, promising she will never abandon them while she lives. Before April she is gone \u2014 riding out without leave, without farewell to the king, with her brother and a free company, north toward the war that never signed the truces."],["quote","My dear and good friends... I promise and certify to you that I will not abandon you as long as I live."],["quote_source","Letter to the citizens of Reims, 16 March 1430"],["date_confidence","attested"],["ref_0","The letter to the Hussites (23 March 1430) and the two letters to Reims, her last correspondence at liberty"]],"links":[],"date":"25 Mar 1430"},"Lagny-sur-Marne \u2014 Franquet d'Arras and the child restored":{"texts":[["campa","At Lagny on the Marne, among men who fight well for the kingdom of France, she takes the field again and breaks the Burgundian routier Franquet d'Arras, who is tried and beheaded for his murders. And at Lagny the canon records a miracle in her own voice: a child three days dead, black as her coat, is carried before the image of Our Lady where the maidens of the town are praying. Jehanne kneels and prays with them; colour returns, the infant yawns three times, is baptized, dies truly, and is buried in consecrated ground \u2014 a soul caught back from limbo for the length of a sacrament."],["quote","The child was three days dead... I was praying with the other maidens before the image of Our Lady, and at last life appeared in him; he yawned three times, and was then baptized; and soon he died, and was buried in consecrated ground."],["quote_source","Trial of condemnation, session of 3 March 1431"],["date_confidence","inferred"],["ref_0","The abbey church of Lagny (Notre-Dame-des-Ardents), scene of the infant's return"]],"links":[],"date":"14 Apr 1430"},"Melun \u2014 the voices foretell the capture":{"texts":[["campa","Melun casts out its Burgundian garrison at her coming, in Easter week. Walking on the town ditches, she receives from Saint Catherine and Saint Margaret the hardest of all their messages: she will be taken prisoner before Saint John's Day; it must be so; she must not be astonished, but accept it with a good heart, and God will help her. She begs that she may die quickly when taken, without the long travail of prison; the voices answer only: take everything with a good grace, it must be thus. From this day she stands under a sentence she alone can read, and she rides north anyway."],["quote","In Easter week last, when I was on the ditches of Melun, I was told by my voices \u2014 that is, by Saint Catherine and Saint Margaret \u2014 that I should be taken prisoner before Saint John's Day; and that so it must be; and that I should not be dismayed, but take all in good part, and God would help me."],["quote_source","Trial of condemnation, session of 10 March 1431"],["date_confidence","attested"],["ref_0","The town ditches of Melun, where the sentence was spoken"]],"links":[],"date":"26 Apr 1430"},"Compi\u00e8gne \u2014 entry into the besieged city":{"texts":[["campa","Burgundy has come down on Compi\u00e8gne, the loyal city that refused to be handed over by treaty. Jehanne swears the good sentence the chronicles keep \u2014 she will see her good friends of Compi\u00e8gne \u2014 and rides into the town at dawn with her free lances, welcomed with wine and processions by the townsmen who know what her presence is worth. She spends the fortnight striking at the besiegers' web: Pont-l'\u00c9v\u00eaque, Soissons \u2014 where a traitor captain shuts the bridge against her, and sells the town within days. Thinned to a few hundred, her company turns back for Compi\u00e8gne. Saint John's Day is five weeks away."],["date_confidence","attested"],["ref_0","The H\u00f4tel de Ville of Compi\u00e8gne and its Jeanne d'Arc memorials, the city that never fell"]],"links":[],"date":"22 May 1430"},"Margny, before Compi\u00e8gne \u2014 the capture":{"texts":[["campa","At dawn she hears mass at Saint-Jacques and, the town's memory keeps, tells the children round the pillar that she is sold and betrayed and will soon be given to death. At five in the evening she leads a sortie over the bridge against Margny, in a huque of crimson and gold. Twice she drives the Burgundians; then Luxembourg's main force closes. She holds the rearguard on the causeway, last of all, crying to the retreating men to strike. The town's drawbridge rises behind her. An archer of the Bastard of Wandomme drags her from her horse by the golden coat. The prophecy of Melun is accomplished."],["quote","Think only of striking at them!... It shall rest with you alone that they are discomfited."],["quote_source","Perceval de Cagny, Chroniques (her words in the sortie)"],["date_confidence","attested"],["ref_0","The meadow of Margny by the Oise bridge, where the archer pulled her down"]],"links":[],"date":"1 Jun 1430"},"Beaulieu-l\u00e8s-Fontaines \u2014 first prison, first escape":{"texts":[["campa","Jean de Luxembourg lodges his prize in his castle of Beaulieu-l\u00e8s-Fontaines, in Vermandois. Her squire d'Aulon, captive with her and serving her still, mourns that Compi\u00e8gne will fall; she answers that it will not: no place the King of Heaven has put in the hands of King Charles by her means will be lost. She squeezes between two planks of her prison toward the door of the yard, and would have locked her guards in the tower, had not the porter crossed her path. It is lawful, she will maintain to her judges' faces, for any prisoner to escape. They move her deeper into Burgundian land."],["quote","It is true that I wished to escape, and so I would from any prison; for I have never been a prisoner anywhere but that I would gladly escape. It is lawful for any prisoner to escape."],["quote_source","Trial of condemnation, session of 15 March 1431"],["date_confidence","inferred"],["ref_0","The castle platform of Beaulieu-l\u00e8s-Fontaines, the prison of the planks"]],"links":[],"date":"10 Jun 1430"},"Beaurevoir \u2014 the three ladies and the leap from the tower":{"texts":[["campa","Four months in Luxembourg's tower at Beaurevoir, where three ladies of the house \u2014 aunt, wife, stepdaughter, all named Jeanne \u2014 grow to love her and offer cloth for a woman's dress; she would have yielded to them sooner than to any lady of France save her queen. Then word comes that Compi\u00e8gne is to be put to fire and sword, and that she is sold to the English. Against Saint Catherine's daily counsel she commends herself to God and leaps from the tower \u2014 sixty feet \u2014 and is found by the wall unbroken, senseless, unbleeding. Saint Catherine bids her be comforted: Compi\u00e8gne shall have succour. She eats again."],["quote","I did it not out of despair, but in the hope of saving my body and of going to succour the good people in need... And after I had fallen, the voice of Saint Catherine told me to be of good cheer, for they of Compi\u00e8gne would have succour."],["quote_source","Trial of condemnation, session of 14 March 1431"],["date_confidence","inferred"],["ref_0","The Tour Jeanne d'Arc at Beaurevoir, last stump of the castle of the leap"]],"links":[],"date":"24 Aug 1430"},"Arras \u2014 the prisoner and the portrait":{"texts":[["campa","Sold for ten thousand livres tournois \u2014 a king's ransom paid by England through the taxes of conquered Normandy \u2014 she passes into the Duke of Burgundy's city of Arras on the long road to Rouen. Here a Scot shows her a painting of herself: full-armed, kneeling on one knee, presenting a letter to her king. It is the only image of herself she ever speaks of seeing, and she speaks of it to her judges without vanity, a girl looking at the legend already detaching itself from her. The University of Paris has claimed her for the Inquisition; the Church militant has become the hunting arm of England."],["quote","I saw at Arras a painting in the hands of a Scot: it showed me all armed, presenting a letter to my king, kneeling on one knee."],["quote_source","Trial of condemnation, session of 3 March 1431"],["date_confidence","traditional"],["ref_0","The lost Scottish portrait of the Maid, the one likeness she acknowledged"]],"links":[],"date":"24 Nov 1430"},"Le Crotoy \u2014 the sea-castle on the Somme":{"texts":[["campa","In the English sea-fortress of Le Crotoy, where the Somme meets the Channel, the Maid of the rivers first sees the tide. A captive chancellor of Amiens says mass in the castle daily and hears her in confession; he goes out saying he has never seen a better Christian. The good wives of Abbeville take boat down the estuary to visit and comfort her, and she thanks them and commends herself to their prayers. Then at low water she is ferried across the bay to Saint-Valery \u2014 the crossing where the Conqueror once waited for his wind \u2014 and the road runs now only one way: Eu, Dieppe, Rouen."],["date_confidence","traditional"],["ref_0","The castle platform of Le Crotoy over the Somme bay, her last prison before Normandy"]],"links":[],"date":"19 Dec 1430"},"Rouen \u2014 the tower of the castle of Bouvreuil":{"texts":[["campa","Two days before Christmas she is brought into Rouen, capital of English France, and lodged not in a Church prison with women to attend her, as law requires of an ecclesiastical accused, but in the castle of Bouvreuil, in a tower cell, irons on her feet, chained by night to a beam, watched day and night by English guards of the meanest sort. An iron cage is forged to hold her upright, the canon remembers, though the chains suffice. The child-king Henry VI keeps court in the same castle. Cauchon, bishop of ruined Beauvais, assembles his assessors and buys his jurisdiction. The instrument of the Passion is prepared."],["date_confidence","traditional"],["ref_0","The surviving donjon called the Tour Jeanne d'Arc, and the vanished Tour de la Pucelle of her cell"]],"links":[],"date":"1 Jan 1431"},"Rouen \u2014 the first public session in the royal chapel":{"texts":[["campa","Before Cauchon and some forty doctors in the chapel royal of Rouen castle, the girl of nineteen is brought in her page's suit, chained, alone against the University of Paris. Required to swear on the Gospels to answer everything, she makes at once the distinction that holds through fifteen interrogations: of her father and mother and her deeds since she took the road to France, gladly; of her revelations from God, to no man here, though they cut off her head. She takes the oath kneeling, hands on the missal \u2014 on her own terms. Asked to say the Paternoster: hear me in confession and I will say it gladly."],["quote","Of my father and my mother, and of what I have done since I took the road to France, I will gladly swear; but the revelations that have come to me from God I have never told or revealed to anyone save to Charles my king; nor will I reveal them though my head be cut off."],["quote_source","Trial of condemnation, session of 21 February 1431"],["date_confidence","attested"],["ref_0","The trial manuscript (Biblioth\u00e8que de l'Assembl\u00e9e nationale ms 1119; BnF lat. 5965), the notaries' record"]],"links":[],"date":"2 Mar 1431"},"Rouen \u2014 the answer on the grace of God":{"texts":[["campa","In the robing chamber at the end of the great hall, before sixty judges, the theologian Beaup\u00e8re lays the perfect trap: does she know herself to be in God's grace? Yes condemns her of presumption, no out of her own mouth. The notaries record that the questioners themselves were stupefied by her answer, and the court adjourns soon after. The same day she tells them how the voice woke her at noon; the voice is beautiful, sweet and low, and speaks the tongue of France. Asked another day if Saint Margaret speaks English: why should she, who is not on the English side?"],["quote","If I am not in the grace of God, may God put me there; and if I am, may God so keep me. I should be the saddest creature in the world if I knew I were not in the grace of God."],["quote_source","Trial of condemnation, session of 24 February 1431"],["date_confidence","attested"],["ref_0","The notaries' minute (Guillaume Manchon's French record) of the answer that stupefied the court"]],"links":[],"date":"5 Mar 1431"},"Rouen \u2014 the prison sessions and the promise of Paradise":{"texts":[["campa","The public sessions done, Cauchon carries the interrogation into her cell, small parties of examiners at the bedside of a chained girl. Here the record reaches its highest places: her saints have promised to lead her to Paradise, as she asked of them; she is as sure of it as if she were there already; and when the judges seize on it \u2014 if sure of salvation, why confess? \u2014 she answers that one cannot be too careful. Asked about her leap, the sign given the king, her banner, she answers or refuses with the same unhurried courtesy. The judges call it the great promise; she calls it a treasure."],["quote","Take everything peacefully; do not fret at your martyrdom; you shall come at last into the kingdom of Paradise... I hold to it as firmly as if I were there already."],["quote_source","Trial of condemnation, prison session of 14 March 1431"],["date_confidence","attested"],["ref_0","The Tour Jeanne d'Arc keep at Rouen, sole survivor of the castle of the trial"]],"links":[],"date":"23 Mar 1431"},"Rouen \u2014 the torture chamber of the great tower":{"texts":[["campa","They bring her into the great tower where the instruments are laid out and the executioners stand ready, and threaten her with the question. She looks at the rack and gives them the answer that closes the argument of force forever: tear her limb from limb and drive the soul from her body, she will say nothing else; and whatever they wring from her she will afterward declare was wrung by force and worth nothing. The judges withdraw and vote: torture would profit nothing, and would soil a beautiful trial \u2014 un si beau proc\u00e8s \u2014 with the mark of the tongs. Three days later they decide to forgo it."],["quote","Truly, if you were to tear me limb from limb and drive my soul out of my body, I would tell you nothing more; and if I did say anything to you, afterward I should always declare that you had made me say it by force."],["quote_source","Trial of condemnation, session of 9 May 1431"],["date_confidence","attested"],["ref_0","The vaulted chamber of the Rouen donjon shown as the torture room of 9 May"]],"links":[],"date":"18 May 1431"},"The cemetery of Saint-Ouen \u2014 the abjuration":{"texts":[["campa","On two scaffolds in the abbey cemetery, before cardinals, bishops, a great crowd, the preacher \u00c9rard cries that Charles her king is a heretic; led to the edge of the fire, she interrupts him to defend the king with her life. Then the sentence is begun, the executioner's cart waits, in the noise and pressing \u2014 promised her life, the Church's prison, women about her \u2014 she yields and repeats a short abjuration, signing with a cross while something like a laugh passes over her face. They read her instead into perpetual prison on the bread of sorrow and the water of affliction, and return her to the English chains."],["quote","I dare say and swear, on pain of my life, that he is the most noble Christian of all Christians, and best loves the faith and the Church of all."],["quote_source","Rehabilitation testimony of Jean Massieu and others on the sermon of Guillaume \u00c9rard, 24 May 1431"],["date_confidence","attested"],["ref_0","The abbey church of Saint-Ouen and its cemetery close, ground of the two scaffolds"]],"links":[],"date":"2 Jun 1431"},"Rouen \u2014 the relapse in the cell":{"texts":[["campa","Four days in a woman's dress among English guards who mock and mishandle her, the promises broken \u2014 no Church prison, no women, the chains still on. On Trinity Sunday her man's clothes are found on her again; whether left in the sack by design or resumed in defence of her body, the trap shuts either way. When the judges come on Monday she is wholly herself again: her voices have told her the great pity of the treason she consented to when she abjured to save her life. Cauchon comes out to the waiting Englishmen, the witnesses say, laughing: farewell, be of good cheer \u2014 it is done."],["quote","What I said, I said for fear of the fire... God has told me by Saint Catherine and Saint Margaret of the great pity of the treason to which I consented in abjuring to save my life: I damned myself to save my life."],["quote_source","Trial of condemnation, session of 28 May 1431"],["date_confidence","attested"],["ref_0","The parchment cedula of abjuration, six lines she signed and unsaid"]],"links":[],"date":"6 Jun 1431"},"The Vieux-March\u00e9 \u2014 the stake":{"texts":[["campa","In the morning Ladvenu brings the Body of Christ to her cell, and she cries to Cauchon: bishop, I die through you. On a plastered scaffold in the Old Market, mitred with the paper cap of heresy, she asks for a cross; an English soldier binds one of two sticks and she puts it in her breast, and Isambart holds the crucifix of Saint-Sauveur before her eyes in the smoke. She calls on her saints, forgives, and cries Jesus until the last. Her heart will not burn. The executioner tells the friars he has burned a saint; the ashes go into the Seine, which carries them to the sea."],["quote","Ah, Rouen, I greatly fear you may have to suffer for my death!... Jesus! Jesus!"],["quote_source","Rehabilitation testimony of Jean Massieu, Isambart de la Pierre and Martin Ladvenu (1456)"],["date_confidence","attested"],["ref_0","The cross of the Vieux-March\u00e9 at Rouen and the unburned heart cast into the Seine"]],"links":[],"date":"8 Jun 1431"}},"stop_color":"#1a1a1a","route_color":"#c83727","route_width":0.0007,"stop_size":0.0011,"traveler_height":0.0225,"traveler_period":75.0}},{"i":2,"parent":null,"name":"firmament","label":"","kind":"sphere","translation":[0.0,0.0,0.0],"rotation":[0.0,0.0,0.0,1.0],"scale":[19.0,19.0,19.0],"color":"#1a2340","opacity":0.22,"side":"inside","unlabeled":1,"ref":null,"boundary":true}],"anims":[],"center":[0.0,0.0,0.0],"mode":"orbit"};

    const tt = t % a.T;
    let k = 0;
    while (k + 1 < a.times.length - 1 && a.times[k + 1] <= tt) k++;
    const span = (a.times[k + 1] - a.times[k]) || 1;
    const u = Math.min(Math.max((tt - a.times[k]) / span, 0), 1);
    const va = a.values[k], vb = a.values[k + 1];

      a.g.quaternion.slerpQuaternions(_qa, _qb, u);

      _va.set(va[0], va[1], va[2]); _vb.set(vb[0], vb[1], vb[2]);
      a.g.position.lerpVectors(_va, _vb, u);
    } else if (a.path === 'scale') {
      _va.set(va[0], va[1], va[2]); _vb.set(vb[0], vb[1], vb[2]);
