:root{--bg:#0d0d0f;--ink:#e7e3d8;--muted:#8a8f99;--line:#23232a;--tone:#6b7280;--link:#6faed9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);

header{display:flex;align-items:baseline;gap:.8rem;padding:1rem 1.4rem;
