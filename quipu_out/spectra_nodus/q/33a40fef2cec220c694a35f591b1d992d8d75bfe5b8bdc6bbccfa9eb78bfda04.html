<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>image</title><style>
:root{--bg:#0d0d0f;--ink:#e7e3d8;--muted:#8a8f99;--line:#23232a;--tone:#6b7280;--link:#6faed9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.6 ui-serif,Georgia,'Times New Roman',serif}
header{display:flex;align-items:baseline;gap:.8rem;padding:1rem 1.4rem;
 border-bottom:1px solid var(--line)}
.brand{font:700 1.2rem ui-monospace,Menlo,monospace;color:var(--ink);
 text-decoration:none;letter-spacing:.04em}
.sub{color:var(--muted);font-size:.85rem}
main{max-width:880px;margin:0 auto;padding:1.6rem 1.4rem 4rem}
.muted{color:var(--muted)} .err{color:#e03131;font-size:.85rem}
.lead h1{font:600 2rem ui-serif,Georgia,serif;margin:.2rem 0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
 gap:.9rem;margin-top:1.4rem}
.card{display:flex;flex-direction:column;gap:.35rem;padding:.9rem 1rem;
 text-decoration:none;color:var(--ink);background:#131319;border:1px solid var(--line);
 border-left:3px solid var(--tone);border-radius:6px;transition:.12s}
.card:hover{background:#17171f;transform:translateY(-1px)}
.c-type{font:600 .7rem ui-monospace,monospace;color:var(--tone);
 text-transform:uppercase;letter-spacing:.08em}
.c-title{font-size:1rem;line-height:1.3}
.c-tone{font-size:.75rem;color:var(--muted);margin-top:auto}
.quipu{border-left:3px solid var(--tone);padding-left:1.2rem}
.scene3d{margin:1rem 0}
.scene3d .s3-stage{position:relative;height:68vh;min-height:420px;border:1px solid var(--line);
 border-radius:6px;overflow:hidden;background:#000}
.scene3d canvas{display:block}
.s3-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 background:rgba(10,10,12,.55);color:#e7e3d8;font:600 .95rem ui-monospace,Menlo,monospace;
 cursor:pointer;z-index:2;text-align:center;padding:1rem;transition:opacity .3s}
.s3-hint.hide{opacity:0;pointer-events:none}
.s3-hint.soft{background:transparent;pointer-events:none;align-items:flex-end;
 justify-content:flex-start;color:#8a8f99}
.s3-plaque{position:absolute;top:.7rem;left:50%;transform:translateX(-50%);
 background:rgba(12,12,16,.78);border:1px solid var(--line);color:#e7e3d8;
 padding:.35rem .8rem;border-radius:6px;font:.8rem ui-monospace,Menlo,monospace;
 opacity:0;transition:opacity .25s;z-index:3;max-width:80%}
.s3-plaque.show{opacity:1}
.s3-dossier{margin-top:.6rem;border:1px solid var(--line);border-radius:6px;
 padding:.85rem 1.1rem;background:#131319;overflow:auto}
.s3-dossier:empty{display:none}
.s3d-head{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;margin-bottom:.3rem}
.s3d-name{font:600 1.05rem ui-serif,Georgia,serif;color:#e7e3d8}
.s3d-date{font:.74rem ui-monospace,Menlo,monospace;color:var(--muted)}
.s3d-tag{font:.66rem ui-monospace,Menlo,monospace;color:var(--muted);opacity:.75;margin-left:auto}
.s3d-imgwrap{float:right;margin:.2rem 0 .5rem .9rem;max-width:220px}
.s3d-img{max-width:220px;max-height:200px;border-radius:4px;display:block}
.s3d-key{font:600 .62rem ui-monospace,Menlo,monospace;color:#8a8f99;
 text-transform:uppercase;letter-spacing:.08em;margin-top:.5rem}
.s3d-text{font:.9rem/1.6 ui-serif,Georgia,serif;color:#d9d5ca;margin:.15rem 0}
blockquote.s3d-text{border-left:2px solid var(--line);padding-left:.6rem;
 margin:.15rem 0;font-style:italic}
.s3d-link{display:inline-block;font:.75rem ui-monospace,Menlo,monospace;
 color:var(--link);margin:.45rem .7rem 0 0;text-decoration:none}
.scene3d figcaption{color:var(--muted);font-size:.85rem;margin-top:.5rem}
.corrected-h{font:600 1.25rem ui-serif,Georgia,serif;margin:2rem 0 .6rem;

.q-head h1{font:600 2rem ui-serif,Georgia,serif;margin:.2rem 0}
.q-prov{display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem .9rem;
 margin:-1rem 0 1.4rem}
.q-block{font:600 .72rem ui-monospace,Menlo,monospace;color:var(--muted)}
.q-txid{font:.68rem/1.4 ui-monospace,Menlo,monospace;color:var(--muted);opacity:.6;
 word-break:break-all}
.q-meta{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 1.4rem}

 border:1px solid var(--line)}
.pill.type{color:var(--tone);border-color:var(--tone)}
.pill.tone{color:var(--muted)}
.edition{font:600 .72rem ui-monospace,monospace;padding:.2rem .55rem;border-radius:999px}
.edition.current{color:#12b886;border:1px solid #12b886}
.edition.superseded{color:var(--muted);border:1px solid var(--line)}
.text{white-space:pre-wrap;font:1.05rem/1.7 ui-serif,Georgia,serif;margin:0}
.essay :is(h1,h2,h3){font-family:ui-serif,Georgia,serif}
.essay img,.image img,.celestial img{max-width:100%;border-radius:6px}
.essay a{color:var(--link)} .essay a:hover{color:#8fc7e8}
.image{margin:0;image-rendering:pixelated}
.image figcaption,.celestial figcaption{color:var(--muted);font-size:.8rem;margin-top:.4rem}
.latex pre,.raw pre{white-space:pre-wrap;word-break:break-word;background:#131319;
 border:1px solid var(--line);border-radius:6px;padding:1rem;font:.85rem ui-monospace,monospace}
.tag{color:var(--muted);font-size:.78rem}
.book-toc{border:1px solid var(--line);border-radius:6px;padding:.8rem 1rem;margin-bottom:1.8rem;background:#131319}
.book-toc-h{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:.4rem}
.book-toc ol{margin:0;padding-left:1.3rem} .book-toc li{margin:.25rem 0} .book-toc a{color:var(--link)}
.chapter-sec{margin-top:2rem} .book .chapter-sec:first-of-type{margin-top:0}

.book .chapter-sec:first-of-type h2.chapter{border-top:none;padding-top:0;margin-top:0}
.chapter-src{margin-top:1.1rem;font-size:.8rem} .chapter-src a{color:var(--link)}
.sealed{text-align:center;padding:2rem;background:#131319;border:1px dashed var(--line);border-radius:8px}
.sealed .lock{font-size:2rem}
.meta{width:100%;border-collapse:collapse;font:.85rem ui-monospace,monospace;margin-top:.6rem}
.meta td{border-top:1px solid var(--line);padding:.35rem .5rem;vertical-align:top}
.meta td:first-child{color:var(--muted);width:30%}
.sky{width:100%;background:#07070c;border-radius:6px;display:block}
.sky .cl line{stroke:#39508f;stroke-width:.7;opacity:.7}
.sky .st circle{fill:#e7e3d8}
.sky .lb text{fill:#7a8194;font:8px ui-monospace,monospace}
.hdr{margin:.2rem 0 1.4rem;font:.82rem ui-monospace,monospace}
.hdr summary{cursor:pointer;color:var(--muted);letter-spacing:.04em}
.hdr table{border-collapse:collapse;margin-top:.5rem}
.hdr td{border-top:1px solid var(--line);padding:.25rem 1rem .25rem 0}
.hdr td:first-child{color:var(--muted)}
.binding pre{white-space:pre-wrap;background:#131319;border:1px solid var(--line);
 border-radius:6px;padding:1rem;font:.85rem/1.55 ui-monospace,monospace}
.binding a{color:var(--tone)} .binding b{color:var(--ink);font-weight:600}
.binding .ext{color:var(--muted);border-bottom:1px dotted var(--muted);cursor:help}
.repub{font-size:.82rem;color:var(--muted);border-left:2px solid var(--tone);
 padding:.35rem .7rem;margin:0 0 1.4rem;background:rgba(255,255,255,.02)}
.repub a{color:var(--tone)}
.qimg{display:inline-block;line-height:0} .qimg img{cursor:zoom-in}
.qimg:hover img{outline:2px solid var(--tone);outline-offset:2px}

.house-roster li{border-left:2px solid var(--line);padding:.1rem 0 .2rem .9rem;overflow:hidden}
.hr-name{font-weight:600;color:var(--ink)}
.hr-dates{color:var(--muted);font-size:.85rem;margin-left:.5rem}

.earth .sea{fill:#aacbe6}

.earth .route line{stroke:#c83727;stroke-width:1.7;opacity:.95;stroke-linecap:round}
.earth .wps circle{fill:#e8b73a;stroke:#5a3a12;stroke-width:.8;cursor:pointer}
.earth .wp:hover circle,.earth .wp.on circle{fill:#fff;r:5.5}

.ej-panel h3{margin:.1rem 0 .4rem;font-size:1.05rem;font-weight:600}
.ej-panel h3 span{color:var(--muted);font-weight:400;font-size:.82rem;font-style:italic}
.ej-panel p{margin:.4rem 0;font-size:.93rem;line-height:1.55}
.ej-panel blockquote{border-left:2px solid var(--tone);margin:.6rem 0;padding-left:.8rem;
 color:#c9c3b4;font-style:italic}
.ej-ref{margin:.8rem 0}
.ej-ref img{display:block;width:100%;border-radius:4px}
.ej-ref blockquote{border-left:2px solid var(--tone);margin:0 0 .3rem;padding-left:.8rem;
 color:#c9c3b4;font-style:italic;font-size:.9rem;line-height:1.5}
.ej-ref figcaption{font-size:.78rem;color:var(--muted)} .ej-ref figcaption a{color:var(--link)}
.ej-refs{font-size:.85rem;margin-top:.6rem!important;line-height:1.7}
.ej-refs a{color:var(--link)} .ej-refs span{color:var(--muted)}
.ej-hint{color:var(--muted);font-style:italic}

.cert-seal{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tone);margin-bottom:1rem}
.cert-meta{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}

.cert-title{font-family:Georgia,serif;font-size:1.7rem;line-height:1.15;margin:.2rem 0 .15rem}
.cert-artist{font-style:italic;color:var(--muted);margin:0 0 1.2rem}
.cert-image{margin:1.3rem 0} .cert-image img{max-width:100%;border-radius:4px}
.cert-text{line-height:1.75}
.cert-authority{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);margin-top:1.5rem;padding-top:.8rem}
.cert-authority a{color:var(--tone)}
.cert-sigs{border-top:1px solid var(--line);margin-top:1rem;padding-top:.7rem}
.cert-sigs-h{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.3rem}
.cert-sig{font-size:.8rem;color:var(--muted);margin:.2rem 0}
.cert-extra{font-size:.85rem;color:var(--muted)}
.latex-fig{margin:1.6rem 0;text-align:center}
.latex-fig svg{display:block;margin:0 auto;width:100%;max-width:340px;height:auto;
 border-radius:4px;box-shadow:0 1px 16px rgba(0,0,0,.45)}
.latex-src{margin:.5rem auto 0;max-width:340px;font-size:.8rem}
.latex-src summary{cursor:pointer;color:var(--muted);letter-spacing:.03em}
.latex-src pre{white-space:pre-wrap;background:#131319;border:1px solid var(--line);
 border-radius:6px;padding:.8rem;font:.78rem/1.5 ui-monospace,monospace;margin-top:.4rem}
.essay-cols{display:flex;flex-direction:column}      /* narrow: prose, then plates */
.marginplate{margin:1.3rem auto}
.marginplate svg,.marginplate img{display:block;width:100%;max-width:340px;height:auto;

.marginplate figcaption{font-size:.72rem;color:var(--muted);text-align:center;
 margin-top:.35rem;letter-spacing:.04em;font-style:italic}
@media(min-width:700px){            /* prose | stacked margin column */
  main.wide{max-width:1180px}
  .essay-cols{flex-direction:row;gap:1.6rem;align-items:flex-start}
  .essay-cols .prose{flex:1 1 0;min-width:0}
  .essay-cols .plates{flex:0 0 236px}
  .plates .marginplate{margin:0 0 1.2rem}          /* just stack, little spacing */

@media(min-width:1040px){           /* roomier window → wider plates */
  .essay-cols .plates{flex:0 0 300px}
}
